# Builds the postgres+pgvector image on REAL amd64 hardware (GitHub-hosted
# ubuntu-latest runners are genuine amd64, not emulated) and pushes to
# GHCR — not registry.fly.io. See README.md §2 for why this matters —
# Postgres 16's build on flyio/postgres-flex compiles with -march=native,
# and building under local Docker Desktop emulation on Apple Silicon risks
# tuning the compiled vector.so for the wrong CPU.
#
# Why GHCR, not registry.fly.io: registry.fly.io/<name> is a per-APP
# namespace — it only exists once an app named <name> exists in your org,
# which `fly postgres create` hasn't run yet at this point. Confirmed by
# hitting this for real: `docker push registry.fly.io/voxai-pg-selfhosted:...`
# failed with "unknown: app repository not found" before the app existed.
# Push to GHCR (public) instead, then `fly postgres create --image-ref`
# pulls from there — this is also the pattern Fly's own community
# recommends for this exact scenario.
#
# The GHCR package must be PUBLIC, not the default private — Fly's
# infrastructure can't authenticate to pull a private third-party
# registry image (confirmed separately this session with the platform's
# own application images). After the first push, go to the package's
# GitHub settings → Change visibility → Public, once.
#
# Manual trigger only for now (workflow_dispatch) — this image changes
# rarely (only when bumping the pgvector or postgres-flex version), unlike
# an application image that rebuilds on every push. Add a path-filtered
# `on: push` trigger later if this folder starts changing more often.

name: Build and push postgres+pgvector image

on:
  workflow_dispatch:
    inputs:
      postgres_flex_tag:
        description: "flyio/postgres-flex base tag"
        required: true
        default: "16.11"
      pgvector_tag:
        description: "pgvector git tag to build"
        required: true
        default: "v0.8.6"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/voxai-pg-selfhosted

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root is voice-agent-database/ (this workflow file must
          # live at .github/workflows/ relative to THAT, per GitHub's own
          # requirement — it's never discovered from a subfolder). The
          # Dockerfile itself lives one level down, in postgres/.
          context: postgres
          platforms: linux/amd64
          push: true
          build-args: |
            POSTGRES_FLEX_TAG=${{ inputs.postgres_flex_tag }}
            PGVECTOR_TAG=${{ inputs.pgvector_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.postgres_flex_tag }}-pgvector${{ inputs.pgvector_tag }}
          provenance: false

      - name: Reminder
        run: |
          echo "::notice::First push only — go make this GHCR package PUBLIC"
          echo "::notice::(github.com/bnp-labs -> Packages -> voxai-pg-selfhosted -> Package settings -> Change visibility)."
          echo "::notice::Fly cannot pull a private third-party registry image."
